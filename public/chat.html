<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<title>AI_CHAT.EXE — Portfolio Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #00ff88;
    --green-dim: #00cc6a;
    --green-muted: rgba(0,255,136,0.12);
    --green-border: rgba(0,255,136,0.25);
    --bg: #0a0d0a;
    --bg-panel: #0d120d;
    --bg-card: #0f150f;
    --text: #c8e8c8;
    --text-dim: #7aaa7a;
    --text-muted: #4a6a4a;
    --scanline: rgba(0,0,0,0.35);
    --amber: #ffb700;
    --red: #ff4466;
    --mono: 'Share Tech Mono', monospace;
    --display: 'VT323', monospace;
    --body: 'Inter', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  /* CRT scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, var(--scanline) 2px, var(--scanline) 4px);
    pointer-events: none;
    z-index: 9999;
    opacity: 0.18;
  }

  /* ─── NAVBAR ─── */
  nav {
    flex-shrink: 0;
    height: 52px;
    padding: 0 2rem;
    display: flex;
    align-items: center;
    gap: 2rem;
    border-bottom: 1px solid var(--green-border);
    background: rgba(10,13,10,0.95);
  }

  .nav-prompt { color: var(--green); font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .nav-prompt .path { color: var(--text-dim); }

  .cursor-blink {
    display: inline-block;
    width: 8px; height: 14px;
    background: var(--green);
    animation: blink 1.1s step-end infinite;
    vertical-align: middle;
  }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .nav-links { display: flex; gap: 1.5rem; margin-left: auto; list-style: none; }
  .nav-links a { color: var(--text-dim); text-decoration: none; font-size: 12px; letter-spacing: 0.08em; transition: color 0.2s; }
  .nav-links a:hover, .nav-links a[aria-current] { color: var(--green); }

  /* ─── LAYOUT ─── */
  .chat-shell {
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 1.25rem 16px;
    display: flex;
    gap: 14px;
  }

  /* ─── CHAT HISTORY SIDEBAR ─── */
  .sidebar {
    width: 268px;
    flex-shrink: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg-panel);
    border: 1px solid var(--green-border);
  }

  .sidebar-head {
    flex-shrink: 0;
    padding: 10px 12px;
    border-bottom: 1px solid var(--green-border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .sidebar-title { display: flex; align-items: center; justify-content: space-between; font-size: 11px; letter-spacing: 0.12em; color: var(--text-dim); }
  .sidebar-title .count { color: var(--text-muted); }
  .sidebar-close { display: none; }

  .new-chat-btn {
    width: 100%;
    background: var(--green);
    color: #000;
    border: none;
    padding: 9px 12px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.2s;
  }

  .new-chat-btn:hover { background: #fff; box-shadow: 0 4px 20px rgba(0,255,136,0.35); }
  .new-chat-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .chat-search {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--green-border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 10px;
    outline: none;
  }

  .chat-search:focus { border-color: var(--green); }
  .chat-search::placeholder { color: var(--text-muted); }

  .chat-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 6px 6px 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--green-border) transparent;
  }

  .chat-group { font-size: 10px; letter-spacing: 0.16em; color: var(--text-muted); padding: 12px 8px 6px; }

  .chat-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    border-left: 2px solid transparent;
    transition: background 0.15s, border-color 0.15s;
  }

  .chat-item:hover { background: var(--green-muted); }
  .chat-item.active { background: var(--green-muted); border-left-color: var(--green); }

  .chat-open {
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    text-align: left;
    padding: 8px 4px 8px 10px;
    cursor: pointer;
    font-family: var(--mono);
    color: var(--text-dim);
  }

  .chat-open:focus-visible { outline: 1px solid var(--green); outline-offset: -1px; }
  .chat-item.active .chat-open { color: var(--green); }
  .chat-open .t { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-open .m { display: block; font-size: 10px; color: var(--text-muted); letter-spacing: 0.06em; margin-top: 2px; }

  .chat-actions { display: flex; gap: 2px; padding-right: 4px; opacity: 0; transition: opacity 0.15s; }
  .chat-item:hover .chat-actions, .chat-item.active .chat-actions, .chat-item:focus-within .chat-actions { opacity: 1; }

  .chat-action {
    background: none;
    border: 1px solid transparent;
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 12px;
    width: 24px;
    height: 24px;
    cursor: pointer;
  }

  .chat-action:hover { color: var(--green); border-color: var(--green-border); }
  .chat-action.del:hover { color: var(--red); border-color: rgba(255,68,102,0.4); }

  .chat-empty, .chat-note { padding: 16px 10px; font-size: 11px; line-height: 1.7; color: var(--text-muted); letter-spacing: 0.04em; }
  .chat-note.warn { color: var(--amber); }

  .history-btn { display: none; }
  .title-text { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }

  .backdrop { display: none; }

  .window {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg-card);
    border: 1px solid var(--green-border);
    box-shadow: 0 8px 40px rgba(0,255,136,0.06);
  }

  .titlebar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--green-border);
    background: var(--bg-panel);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--text-dim);
  }

  .status { display: flex; align-items: center; gap: 6px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
  .status.online .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status.offline .dot { background: var(--amber); }
  .status.online { color: var(--green); }
  .status.offline { color: var(--amber); }

  .icon-btn {
    background: transparent;
    border: 1px solid var(--green-border);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    padding: 5px 10px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .icon-btn:hover { color: var(--green); border-color: var(--green); background: var(--green-muted); }
  .icon-btn:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  /* ─── MESSAGES ─── */
  .messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 1.5rem 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    scrollbar-width: thin;
    scrollbar-color: var(--green-border) transparent;
  }

  .welcome { margin: auto 0; padding: 1rem 0; animation: fadeUp 0.6s ease both; }
  .welcome .eyebrow { font-size: 11px; letter-spacing: 0.2em; color: var(--green); margin-bottom: 0.75rem; border: none; padding: 0; line-height: 1.4; }

  .welcome h1 {
    font-family: var(--display);
    font-weight: normal;
    font-size: clamp(44px, 9vw, 72px);
    line-height: 1;
    color: var(--green);
    text-shadow: 0 0 40px rgba(0,255,136,0.3);
    margin-bottom: 1rem;
  }

  .welcome h1 span { color: var(--text); }

  .welcome p {
    font-size: 13px;
    line-height: 1.8;
    color: var(--text-dim);
    border-left: 2px solid var(--green-border);
    padding-left: 1rem;
    max-width: 560px;
    margin-bottom: 1.5rem;
  }

  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; }

  .suggestion {
    background: transparent;
    border: 1px solid var(--green-border);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 12px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
  }

  .suggestion:hover { border-color: var(--green); color: var(--green); background: var(--green-muted); }

  /* ─── CHAT BUBBLES: you on the right, AI on the left ─── */
  .msg {
    display: flex;
    flex-direction: column;
    gap: 5px;
    max-width: 100%;
    animation: fadeUp 0.3s ease both;
  }

  .msg.user { align-items: flex-end; }
  .msg.assistant { align-items: flex-start; }

  .msg-label { font-size: 10px; letter-spacing: 0.16em; color: var(--text-muted); padding: 0 6px; }
  .msg.user .msg-label { color: var(--green-dim); }
  .msg.assistant .msg-label { color: var(--text-dim); }

  .msg-body {
    position: relative;
    min-width: 0;
    max-width: min(78%, 680px);
    padding: 10px 14px;
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.65;
    color: var(--text);
    overflow-wrap: anywhere;
    border: 1px solid var(--green-border);
  }

  /* little speech-bubble tails: a solid point on the bottom corner nearest the speaker */
  .msg-body::after {
    content: '';
    position: absolute;
    bottom: -1px;
    width: 9px;
    height: 9px;
  }

  .msg.user .msg-body {
    font-family: var(--mono);
    font-size: 14px;
    white-space: pre-wrap;
    color: #e4ffef;
    background: rgba(0,255,136,0.13);
    border-color: rgba(0,255,136,0.45);
    border-radius: 12px 12px 2px 12px;
    box-shadow: 0 0 18px rgba(0,255,136,0.08);
  }

  .msg.user .msg-body::after {
    right: -8px;
    background: rgba(0,255,136,0.45);
    clip-path: polygon(0 0, 0 100%, 100% 100%);
  }

  .msg.assistant .msg-body {
    background: var(--bg-panel);
    border-radius: 12px 12px 12px 2px;
    max-width: min(86%, 760px);
  }

  .msg.assistant .msg-body::after {
    left: -8px;
    background: rgba(0,255,136,0.3);
    clip-path: polygon(100% 0, 0 100%, 100% 100%);
  }

  /* bubbles holding code or long answers can use the full width */
  .msg.assistant .msg-body:has(.code-block) { width: min(86%, 760px); }

  .msg.error .msg-body {
    color: var(--red);
    font-family: var(--mono);
    font-size: 13px;
    background: rgba(255,68,102,0.07);
    border-color: rgba(255,68,102,0.45);
  }

  .msg.error .msg-body::after { background: rgba(255,68,102,0.45); }
  .msg.error .msg-label { color: var(--red); }

  /* consecutive bubbles from the same side sit closer together */
  .msg.user + .msg.user, .msg.assistant:not(.error) + .msg.assistant:not(.error) { margin-top: -0.85rem; }
  .msg.user + .msg.user .msg-label, .msg.assistant:not(.error) + .msg.assistant:not(.error) .msg-label { display: none; }

  /* rendered markdown */
  .msg-body > * + * { margin-top: 0.75em; }
  .msg-body h3, .msg-body h4 { font-family: var(--display); font-weight: normal; font-size: 24px; color: var(--green); line-height: 1.1; }
  .msg-body ul, .msg-body ol { padding-left: 1.4em; }
  .msg-body li + li { margin-top: 0.25em; }
  .msg-body li::marker { color: var(--green); }
  .msg-body strong { color: #fff; font-weight: 500; }
  .msg-body a { color: var(--green); }
  .msg-body blockquote { border-left: 2px solid var(--text-muted); padding-left: 12px; color: var(--text-dim); }

  .msg-body code {
    font-family: var(--mono);
    font-size: 0.9em;
    background: var(--green-muted);
    color: var(--green);
    padding: 1px 5px;
  }

  .code-block { position: relative; border: 1px solid var(--green-border); background: var(--bg); }
  .code-block .code-head { display: flex; justify-content: space-between; align-items: center; padding: 4px 4px 4px 12px; border-bottom: 1px solid var(--green-border); font-family: var(--mono); font-size: 11px; color: var(--text-muted); letter-spacing: 0.08em; }
  .code-block pre { overflow-x: auto; padding: 12px; margin: 0; }
  .code-block pre code { background: none; padding: 0; color: var(--text); font-size: 13px; line-height: 1.6; }
  .code-block .icon-btn { padding: 3px 8px; font-size: 10px; }

  .typing { display: inline-flex; gap: 4px; align-items: center; color: var(--text-muted); font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; }
  .typing .cursor-blink { width: 7px; height: 13px; }

  /* ─── COMPOSER ─── */
  .composer {
    flex-shrink: 0;
    border-top: 1px solid var(--green-border);
    background: var(--bg-panel);
    padding: 12px;
  }

  .composer form { display: flex; gap: 10px; align-items: flex-end; }

  .input-wrap {
    flex: 1;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--green-border);
    padding: 10px 12px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-wrap:focus-within { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-muted); }
  .input-wrap .prompt { color: var(--green); font-size: 14px; line-height: 22px; }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 22px;
    max-height: 180px;
    caret-color: var(--green);
  }

  textarea::placeholder { color: var(--text-muted); }

  .btn-primary {
    background: var(--green);
    color: #000;
    border: none;
    padding: 0 20px;
    height: 44px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-primary:hover:not(:disabled) { background: #fff; box-shadow: 0 4px 20px rgba(0,255,136,0.4); }
  .btn-primary:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary.stop { background: transparent; color: var(--red); border: 1px solid var(--red); }
  .btn-primary.stop:hover { background: rgba(255,68,102,0.1); box-shadow: none; }

  /* ─── HP BAR (daily token budget) ─── */
  .hp {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }

  .hp[hidden] { display: none; }

  .hp-label {
    font-family: var(--display);
    font-size: 20px;
    line-height: 1;
    letter-spacing: 0.04em;
    color: var(--hp-color, var(--green));
    text-shadow: 0 0 10px var(--hp-glow, rgba(0,255,136,0.4));
    min-width: 2ch;
  }

  .hp-bar {
    position: relative;
    flex: 1;
    height: 14px;
    background: var(--bg);
    border: 1px solid var(--green-border);
    padding: 2px;
    overflow: hidden;
  }

  .hp-fill {
    height: 100%;
    width: 100%;
    background: var(--hp-color, var(--green));
    box-shadow: 0 0 10px var(--hp-glow, rgba(0,255,136,0.4));
    transition: width 0.6s cubic-bezier(.2,.8,.2,1), background-color 0.4s;
    transform-origin: left;
  }

  /* segment notches, like a retro health bar */
  .hp-bar::after {
    content: '';
    position: absolute;
    inset: 2px;
    background: repeating-linear-gradient(90deg, transparent 0, transparent calc(5% - 2px), var(--bg) calc(5% - 2px), var(--bg) 5%);
    pointer-events: none;
  }

  /* recent damage flash */
  .hp-bar .hp-damage {
    position: absolute;
    top: 2px; bottom: 2px;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }

  .hp-bar .hp-damage.hit { animation: hpHit 0.7s ease-out; }
  @keyframes hpHit { 0% { opacity: 0.85; } 100% { opacity: 0; } }

  .hp-text { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hp-text strong { color: var(--hp-color, var(--green)); font-weight: normal; }

  .hp.mid { --hp-color: var(--amber); --hp-glow: rgba(255,183,0,0.4); }
  .hp.low { --hp-color: var(--red); --hp-glow: rgba(255,68,102,0.5); }
  .hp.low .hp-label, .hp.low .hp-fill { animation: hpLow 1s step-end infinite; }
  @keyframes hpLow { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  .hp.empty .hp-text strong { color: var(--red); }

  /* requests-left counter, styled like an ammo/lives counter */
  .req {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px 2px 6px;
    border: 1px solid var(--req-border, var(--green-border));
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
  }

  .req[hidden] { display: none; }
  .req-icon { color: var(--req-color, var(--green)); font-size: 13px; line-height: 1; text-shadow: 0 0 8px var(--req-glow, rgba(0,255,136,0.4)); }
  .req strong { color: var(--req-color, var(--green)); font-weight: normal; }
  .req.bump .req-icon { animation: reqBump 0.5s ease-out; }
  @keyframes reqBump { 0% { transform: scale(1.6); } 100% { transform: none; } }
  .req.mid { --req-color: var(--amber); --req-glow: rgba(255,183,0,0.4); --req-border: rgba(255,183,0,0.35); }
  .req.low { --req-color: var(--red); --req-glow: rgba(255,68,102,0.5); --req-border: rgba(255,68,102,0.4); }
  .req.low .req-icon { animation: hpLow 1s step-end infinite; }

  .composer-hint { margin-top: 8px; font-size: 11px; color: var(--text-muted); letter-spacing: 0.04em; display: flex; justify-content: space-between; gap: 1rem; }

  /* On tablets and phones the history becomes a slide-out drawer */
  @media (max-width: 900px) {
    .sidebar {
      position: fixed;
      top: 0; bottom: 0; left: 0;
      z-index: 50;
      width: min(300px, 86vw);
      transform: translateX(-105%);
      transition: transform 0.25s ease;
      box-shadow: 8px 0 40px rgba(0,0,0,0.6);
    }
    body.drawer-open .sidebar { transform: none; }
    .backdrop { display: block; position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    body.drawer-open .backdrop { opacity: 1; pointer-events: auto; }
    .sidebar-close { display: inline-block; }
    .history-btn { display: inline-block; }
    .chat-actions { opacity: 1; }
  }

  @media (max-width: 640px) {
    nav { padding: 0 16px; gap: 1rem; }
    .nav-prompt .hide-sm { display: none; }
    .nav-links { gap: 1rem; }
    .chat-shell { padding: 0; }
    .window { border-left: none; border-right: none; border-top: none; }
    .messages { padding: 1.25rem 16px; }
    .msg-body, .msg.assistant .msg-body { max-width: 88%; }
    .msg.assistant .msg-body:has(.code-block) { width: 88%; }
    .titlebar .title-text { display: none; }
    .composer-hint .kbd-hint { display: none; }
    .hp .hp-long { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-prompt">
    <span>▶</span>
    <span class="path">~/portfolio</span>
    <span>$</span>
    <span style="color:var(--text-dim)" class="hide-sm">./ai_chat</span>
    <span class="cursor-blink"></span>
  </div>
  <ul class="nav-links">
    <li><a href="/">PORTFOLIO</a></li>
    <li><a href="/chat.html" aria-current="page">AI CHAT</a></li>
    <li><a href="/logout">LOGOUT</a></li>
  </ul>
</nav>

<div class="chat-shell">
  <aside class="sidebar" id="sidebar" aria-label="Chat history">
    <div class="sidebar-head">
      <div class="sidebar-title">
        <span>SAVED_CHATS/ <span class="count" id="chatCount"></span></span>
        <button class="icon-btn sidebar-close" id="closeDrawerBtn" type="button" aria-label="Close chat history">✕</button>
      </div>
      <button class="new-chat-btn" id="newChatBtn" type="button">[ + NEW CHAT ]</button>
      <input class="chat-search" id="chatSearch" type="search" placeholder="Search chats…" aria-label="Search chats" autocomplete="off">
    </div>
    <div class="chat-list" id="chatList" role="list" aria-label="Previous chats"></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <div class="window">
    <div class="titlebar">
      <button class="icon-btn history-btn" id="openDrawerBtn" type="button" aria-label="Show chat history">☰ CHATS</button>
      <span class="title-text" id="chatTitle">AI_SESSION.LOG</span>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">CONNECTING…</span></div>
    </div>

    <div class="messages" id="messages" aria-live="polite"></div>

    <div class="composer">
      <div class="hp" id="hp" hidden role="meter" aria-label="AI tokens left today" aria-valuemin="0">
        <span class="hp-label">HP</span>
        <div class="hp-bar"><div class="hp-fill" id="hpFill"></div><div class="hp-damage" id="hpDamage"></div></div>
        <span class="hp-text" id="hpText"></span>
        <span class="req" id="req" hidden role="meter" aria-label="AI requests left today" aria-valuemin="0">
          <span class="req-icon" aria-hidden="true">⚡</span><span id="reqText"></span>
        </span>
      </div>
      <form id="chatForm">
        <label class="input-wrap" for="input">

          <textarea id="input" rows="1" placeholder="Ask me anything…" autocomplete="off" aria-label="Message"></textarea>
        </label>
        <button class="btn-primary" id="sendBtn" type="submit" disabled>SEND</button>

<template id="welcomeTpl">
  <div class="welcome">
    <p class="eyebrow">// ASSISTANT ONLINE</p>
    <h1>AI <span>C</span>HAT</h1>
    <p>Talk to an AI assistant, just like a normal chat. Ask questions, brainstorm ideas, get help with code or writing. Every chat is saved to the list on the left, so you can come back to it any time, on any device.</p>
    <div class="suggestions">
      <button class="suggestion" type="button">Help me brainstorm a narrative game idea</button>
      <button class="suggestion" type="button">Explain how a CRT scanline effect works in CSS</button>
      <button class="suggestion" type="button">Write a short cover letter opener for a games studio</button>
    </div>
  </div>
</template>

<script>
(function () {
  'use strict';

  var LEGACY_KEY = 'byjeki_chat_v1';      // single conversation kept by older versions of this page
  var CURRENT_KEY = 'byjeki_chat_current'; // which chat was open last
  var messagesEl = document.getElementById('messages');
  var form = document.getElementById('chatForm');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('sendBtn');
  var statusEl = document.getElementById('status');
  var statusText = document.getElementById('statusText');

  // active = the conversation on screen: { id, title, messages: [{ role, content }], saved }
  var active = { id: null, title: '', messages: [], saved: false };
  var summaries = [];     // sidebar list: [{ id, title, createdAt, updatedAt, count }], newest first
  var cache = {};         // id → full chat already downloaded
  var historyOk = true;   // false if the server-side history store is unavailable
  var controller = null;  // AbortController for the in-flight request
  var configured = null;  // null = unknown, true/false after status check

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }

  // ─── tiny, safe markdown renderer ───
  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function inline(s) {
    // s is already escaped
    var codes = [];
    s = s.replace(/`([^`\n]+)`/g, function (_, c) { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    s = s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return '<code>' + codes[+i] + '</code>'; });
    return s;
  }

  function renderMarkdown(src) {
    var out = [];
    var parts = src.split(/^```/m);
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        var nl = parts[i].indexOf('\n');
        var lang = nl === -1 ? '' : parts[i].slice(0, nl).trim();
        var code = nl === -1 ? '' : parts[i].slice(nl + 1).replace(/\n$/, '');
        out.push('<div class="code-block"><div class="code-head"><span>' + esc(lang || 'code') +
          '</span><button class="icon-btn copy-btn" type="button">COPY</button></div><pre><code>' + esc(code) + '</code></pre></div>');
        continue;
      }
      var blocks = parts[i].split(/\n{2,}/);
      for (var b = 0; b < blocks.length; b++) {
        var block = blocks[b].replace(/^\n+|\n+$/g, '');
        if (!block) continue;
        var lines = block.split('\n');
        if (lines.every(function (l) { return /^\s*[-*+]\s+/.test(l); })) {
          out.push('<ul>' + lines.map(function (l) { return '<li>' + inline(esc(l.replace(/^\s*[-*+]\s+/, ''))) + '</li>'; }).join('') + '</ul>');
        } else if (lines.every(function (l) { return /^\s*\d+[.)]\s+/.test(l); })) {
          out.push('<ol>' + lines.map(function (l) { return '<li>' + inline(esc(l.replace(/^\s*\d+[.)]\s+/, ''))) + '</li>'; }).join('') + '</ol>');
        } else if (/^#{1,6}\s/.test(lines[0]) && lines.length === 1) {
          out.push('<h3>' + inline(esc(lines[0].replace(/^#+\s*/, ''))) + '</h3>');
        } else if (lines.every(function (l) { return /^>\s?/.test(l); })) {
          out.push('<blockquote>' + inline(esc(lines.map(function (l) { return l.replace(/^>\s?/, ''); }).join('\n'))).replace(/\n/g, '<br>') + '</blockquote>');
        } else {
          out.push('<p>' + lines.map(function (l) {
            return /^#{1,6}\s/.test(l) ? '<strong>' + inline(esc(l.replace(/^#+\s*/, ''))) + '</strong>' : inline(esc(l));
          }).join('<br>') + '</p>');
        }
      }
    }
    return out.join('');
  }

  // ─── UI helpers ───
  function atBottom() { return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80; }
  function scrollDown(force) { if (force || atBottom()) messagesEl.scrollTop = messagesEl.scrollHeight; }

  function addMessage(role, content, opts) {
    var w = messagesEl.querySelector('.welcome');
    if (w) w.remove();
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + role + (opts && opts.error ? ' error' : '');
    var label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = opts && opts.error ? '> SYSTEM ERROR' : role === 'user' ? '> YOU' : '> AI';
    var body = document.createElement('div');
    body.className = 'msg-body';
    if (role === 'user' || (opts && opts.error)) body.textContent = content;
    else body.innerHTML = renderMarkdown(content);
    wrap.appendChild(label);
    wrap.appendChild(body);
    messagesEl.appendChild(wrap);
    scrollDown(true);
    return body;
  }

  function showWelcome() {
    messagesEl.innerHTML = '';
    messagesEl.appendChild(document.getElementById('welcomeTpl').content.cloneNode(true));
    messagesEl.querySelectorAll('.suggestion').forEach(function (btn) {
      btn.addEventListener('click', function () { input.value = btn.textContent; autosize(); send(); });
    });
  }

  function setStatus(kind, text) {
    statusEl.className = 'status ' + kind;
    statusText.textContent = text;
  }

  function setBusy(busy) {
    sendBtn.textContent = busy ? 'STOP' : 'SEND';
    sendBtn.classList.toggle('stop', busy);
    sendBtn.type = busy ? 'button' : 'submit';
    updateSendState();
  }

  function updateSendState() {
    sendBtn.disabled = !controller && input.value.trim() === '';
  }

  function autosize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 180) + 'px';
    updateSendState();
  }

  // ─── HP bar (daily token budget) ───
  var hpEl = document.getElementById('hp');
  var hpFill = document.getElementById('hpFill');
  var hpDamage = document.getElementById('hpDamage');
  var hpText = document.getElementById('hpText');
  var lastPct = null;
  var reqEl = document.getElementById('req');
  var reqText = document.getElementById('reqText');
  var lastReqLeft = null;

  function compact(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return Math.round(n / 1e3) + 'K';
    return String(n);
  }

  function resetTime(iso) {
    try { return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; }
  }

  function setUsage(u) {
    if (!u || !u.limit) { hpEl.hidden = true; return; }
    var left = Math.max(0, u.limit - u.used);
    var pct = Math.max(0, Math.min(100, (left / u.limit) * 100));
    hpEl.hidden = false;
    hpEl.classList.toggle('mid', pct <= 50 && pct > 20);
    hpEl.classList.toggle('low', pct <= 20);
    hpEl.classList.toggle('empty', left === 0);

    if (lastPct !== null && pct < lastPct - 0.05) {
      hpDamage.style.left = 'calc(2px + (100% - 4px) * ' + (pct / 100) + ')';
      hpDamage.style.width = 'calc((100% - 4px) * ' + ((lastPct - pct) / 100) + ')';
      hpDamage.classList.remove('hit'); void hpDamage.offsetWidth; hpDamage.classList.add('hit');
    }
    lastPct = pct;
    hpFill.style.width = pct + '%';

    var refill = resetTime(u.resetsAt);
    hpText.innerHTML = left === 0
      ? '<strong>0</strong> <span class="hp-long">TOKENS · </span>REFILLS ' + esc(refill)
      : '<strong>' + compact(left) + '</strong> / ' + compact(u.limit) + '<span class="hp-long"> TOKENS LEFT</span>';
    hpEl.title = left.toLocaleString() + ' of ' + u.limit.toLocaleString() + ' tokens left today' + (refill ? ' · refills at ' + refill : '');
    if (typeof u.requestLimit === 'number' && u.requestLimit > 0) {
      var reqLeft = Math.max(0, u.requestLimit - (u.requests || 0));
      var reqPct = (reqLeft / u.requestLimit) * 100;
      reqEl.hidden = false;
      reqEl.classList.toggle('mid', reqPct <= 50 && reqPct > 20);
      reqEl.classList.toggle('low', reqPct <= 20);
      if (lastReqLeft !== null && reqLeft < lastReqLeft) {
        reqEl.classList.remove('bump'); void reqEl.offsetWidth; reqEl.classList.add('bump');
      }
      lastReqLeft = reqLeft;
      reqText.innerHTML = '<strong>' + reqLeft + '</strong><span class="hp-long">/' + u.requestLimit + '</span> REQ';
      reqEl.title = reqLeft + ' of ' + u.requestLimit + ' requests (messages) left today' + (refill ? ' · refills at ' + refill : '');
      reqEl.setAttribute('aria-valuemax', u.requestLimit);
      reqEl.setAttribute('aria-valuenow', reqLeft);
      reqEl.setAttribute('aria-valuetext', reqLeft + ' requests left');
    } else {
      reqEl.hidden = true;
    }
    hpEl.setAttribute('aria-valuemax', u.limit);
    hpEl.setAttribute('aria-valuenow', left);
    hpEl.setAttribute('aria-valuetext', left.toLocaleString() + ' tokens left');
  }

  function refreshUsage() {
    fetch('/api/chat', { headers: { Accept: 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d) setUsage(d.usage); })
      .catch(function () {});
  }

  // ─── talking to the backend ───
  function checkStatus() {
    fetch('/api/chat', { headers: { Accept: 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (d) {
        configured = !!d.configured;
        if (configured) setStatus('online', 'ONLINE · ' + (d.provider ? String(d.provider).toUpperCase() + ' · ' : '') + String(d.model || '').toUpperCase());
        else setStatus('offline', 'NOT CONNECTED');
        setUsage(configured ? d.usage : null);
      })
      .catch(function () { configured = null; setStatus('offline', 'OFFLINE'); });
  }

  function send() {
    var text = input.value.trim();
    if (!text || controller) return;
    input.value = '';
    autosize();

    var chat = active;
    if (!chat.id) {
      chat.id = newId();
      chat.title = titleFrom(text);
      upsertSummary({ id: chat.id, title: chat.title, createdAt: nowIso(), updatedAt: nowIso(), count: 1 }, true);
      setActiveUrl(chat.id);
      updateChatTitle();
    }
    chat.messages.push({ role: 'user', content: text });
    addMessage('user', text);

    var body = addMessage('assistant', '');
    body.innerHTML = '<span class="typing">PROCESSING <span class="cursor-blink"></span></span>';

    controller = new AbortController();
    setBusy(true);
    var reply = '';
    var thinking = false;

    fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: chat.messages }),
      signal: controller.signal
    }).then(function (res) {
      if (!res.ok || !res.body) {
        return res.json().catch(function () { return {}; }).then(function (d) {
          var msg = d.message || ('Request failed (' + res.status + ').');
          if (d.usage) setUsage(d.usage);
          if (d.error === 'budget' && d.usage) msg = 'Out of HP! Today\'s AI token budget is used up. It refills at ' + resetTime(d.usage.resetsAt) + '.';
          if (d.error === 'requests' && d.usage) msg = 'Out of requests! Today\'s AI request limit has been reached. It refills at ' + resetTime(d.usage.resetsAt) + '.';
          if (d.error === 'not_configured') msg = 'The AI isn\'t connected yet. The site owner needs to add an AI API key in Netlify — see the setup guide in the README.';
          if (res.status === 401 || res.redirected) msg = 'Your login has expired. Refresh the page and sign in again.';
          throw new Error(msg);
        });
      }
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      function handleLine(line) {
        if (!line.trim()) return;
        var data;
        try { data = JSON.parse(line); } catch (e) { return; }
        if (data.usage !== undefined) { setUsage(data.usage); return; }
        if (data.error) throw new Error(typeof data.error === 'string' ? data.error : 'The AI returned an error.');
        var m = data.message || {};
        if (m.thinking && !reply) {
          if (!thinking) { thinking = true; body.innerHTML = '<span class="typing">THINKING <span class="cursor-blink"></span></span>'; scrollDown(); }
        }
        if (m.content) {
          reply += m.content;
          body.innerHTML = renderMarkdown(reply) + '<span class="cursor-blink" style="margin-left:2px"></span>';
          scrollDown();
        }
      }
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) { handleLine(buf); return; }
          buf += decoder.decode(r.value, { stream: true });
          var lines = buf.split('\n');
          buf = lines.pop();
          lines.forEach(handleLine);
          return pump();
        });
      }
      return pump();
    }).then(function () {
      finish(chat, body, reply);
    }).catch(function (err) {
      if (err && err.name === 'AbortError') {
        finish(chat, body, reply, true);
        return;
      }
      var onScreen = chat === active;
      body.parentNode.remove();
      if (reply) finish(chat, onScreen ? addMessage('assistant', '') : document.createElement('div'), reply);
      if (onScreen) addMessage('assistant', (err && err.message) || 'Something went wrong.', { error: true });
      if (!reply) {
        chat.messages.pop();
        if (onScreen) { input.value = text; autosize(); }
        if (!chat.saved && !chat.messages.length) dropUnsaved(chat);
      }
      refreshUsage();
      controller = null;
      setBusy(false);
    });
  }

  function finish(chat, body, reply, stopped) {
    if (stopped) refreshUsage();
    if (reply) {
      body.innerHTML = renderMarkdown(reply);
      chat.messages.push({ role: 'assistant', content: reply });
      persist(chat);
    } else {
      if (stopped) body.parentNode.remove();
      else body.innerHTML = '<em style="color:var(--text-muted)">(no response)</em>';
      chat.messages.pop();
      if (!chat.saved && !chat.messages.length) dropUnsaved(chat);
    }
    if (stopped && reply) {
      var note = document.createElement('div');
      note.className = 'msg-label';
      note.textContent = '[ STOPPED ]';
      body.parentNode.appendChild(note);
    }
    controller = null;
    setBusy(false);
    if (chat === active) input.focus();
  }

  // ─── chat history (saved on the server, per logged-in user) ───
  var listEl = document.getElementById('chatList');
  var countEl = document.getElementById('chatCount');
  var searchEl = document.getElementById('chatSearch');
  var titleEl = document.getElementById('chatTitle');

  function nowIso() { return new Date().toISOString(); }

  function newId() {
    var c = window.crypto;
    if (c && c.randomUUID) return c.randomUUID();
    var a = new Uint8Array(16);
    (c || { getRandomValues: function (x) { for (var i = 0; i < x.length; i++) x[i] = Math.random() * 256; return x; } }).getRandomValues(a);
    return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }

  function titleFrom(text) {
    var t = text.replace(/[`*#>_~]/g, '').replace(/\s+/g, ' ').trim();
    return (t || 'New chat').slice(0, 80);
  }

  function api(method, path, body) {
    return fetch('/api/chats' + (path ? '/' + encodeURIComponent(path) : ''), {
      method: method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) { var e = new Error(d.message || ('Request failed (' + r.status + ')')); e.status = r.status; throw e; }
        return d;
      });
    });
  }

  function setActiveUrl(id) {
    lsSet(CURRENT_KEY, id);
    try { history.replaceState(null, '', id ? '#c=' + id : location.pathname); } catch (e) {}
  }

  function updateChatTitle() {
    titleEl.textContent = active.id ? active.title : 'NEW_SESSION';
    titleEl.title = titleEl.textContent;
    document.title = (active.id ? active.title + ' — ' : '') + 'AI_CHAT.EXE';
  }

  function upsertSummary(sum, render) {
    summaries = [sum].concat(summaries.filter(function (c) { return c.id !== sum.id; }));
    summaries.sort(function (a, b) { return b.updatedAt.localeCompare(a.updatedAt); });
    if (render) renderList();
  }

  function dropUnsaved(chat) {
    summaries = summaries.filter(function (c) { return c.id !== chat.id; });
    if (chat === active) { chat.id = null; chat.title = ''; setActiveUrl(null); updateChatTitle(); }
    renderList();
  }

  function persist(chat) {
    if (!historyOk) return;
    var snapshot = chat.messages.slice();
    api('PUT', chat.id, { title: chat.title, messages: snapshot }).then(function (sum) {
      chat.saved = true;
      cache[chat.id] = { id: chat.id, title: sum.title, messages: snapshot };
      upsertSummary(sum, true);
    }).catch(function (err) {
      showNote(err.status === 401 ? 'Your login has expired — refresh to keep saving chats.' : 'Couldn\'t save this chat: ' + err.message, true);
    });
  }

  function dayLabel(iso) {
    var d = new Date(iso), now = new Date();
    var start = function (x) { return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); };
    var days = Math.round((start(now) - start(d)) / 864e5);
    if (days <= 0) return 'TODAY';
    if (days === 1) return 'YESTERDAY';
    if (days < 7) return 'PREVIOUS 7 DAYS';
    if (days < 30) return 'PREVIOUS 30 DAYS';
    return d.toLocaleDateString([], { month: 'long', year: 'numeric' }).toUpperCase();
  }

  function metaLabel(c) {
    var d = new Date(c.updatedAt);
    var when = dayLabel(c.updatedAt) === 'TODAY'
      ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleDateString([], { day: 'numeric', month: 'short' });
    return when + ' · ' + c.count + ' msg' + (c.count === 1 ? '' : 's');
  }

  var noteEl = null;
  function showNote(text, warn) {
    if (!noteEl) { noteEl = document.createElement('div'); }
    noteEl.className = 'chat-note' + (warn ? ' warn' : '');
    noteEl.textContent = text;
    listEl.prepend(noteEl);
  }

  function renderList() {
    var q = searchEl.value.trim().toLowerCase();
    var shown = summaries.filter(function (c) { return !q || c.title.toLowerCase().indexOf(q) !== -1; });
    countEl.textContent = summaries.length ? '(' + summaries.length + ')' : '';
    listEl.innerHTML = '';
    if (noteEl && noteEl.textContent) listEl.appendChild(noteEl);
    if (!historyOk) return;
    if (!shown.length) {
      var empty = document.createElement('div');
      empty.className = 'chat-empty';
      empty.textContent = q ? 'No chats match "' + searchEl.value.trim() + '".' : 'No saved chats yet. Start typing — every new conversation appears here.';
      listEl.appendChild(empty);
      return;
    }
    var group = null;
    shown.forEach(function (c) {
      var g = dayLabel(c.updatedAt);
      if (g !== group) {
        group = g;
        var h = document.createElement('div');
        h.className = 'chat-group';
        h.textContent = '// ' + g;
        listEl.appendChild(h);
      }
      var item = document.createElement('div');
      item.className = 'chat-item' + (c.id === active.id ? ' active' : '');
      item.setAttribute('role', 'listitem');
      item.dataset.id = c.id;
      item.innerHTML =
        '<button class="chat-open" type="button"><span class="t"></span><span class="m"></span></button>' +
        '<span class="chat-actions">' +
          '<button class="chat-action ren" type="button" title="Rename" aria-label="Rename chat">✎</button>' +
          '<button class="chat-action del" type="button" title="Delete" aria-label="Delete chat">✕</button>' +
        '</span>';
      item.querySelector('.t').textContent = c.title;
      item.querySelector('.m').textContent = metaLabel(c);
      item.querySelector('.chat-open').title = c.title;
      if (c.id === active.id) item.querySelector('.chat-open').setAttribute('aria-current', 'true');
      listEl.appendChild(item);
    });
  }

  function renderActive() {
    messagesEl.innerHTML = '';
    if (!active.messages.length) showWelcome();
    else active.messages.forEach(function (m) { addMessage(m.role, m.content); });
    updateChatTitle();
    renderList();
  }

  function newChat() {
    if (controller) controller.abort();
    active = { id: null, title: '', messages: [], saved: false };
    setActiveUrl(null);
    renderActive();
    closeDrawer();
    input.focus();
  }

  function openChat(id) {
    if (id === active.id) { closeDrawer(); return; }
    if (controller) controller.abort();
    var sum = summaries.filter(function (c) { return c.id === id; })[0];
    active = { id: id, title: sum ? sum.title : '', messages: [], saved: true };
    setActiveUrl(id);
    closeDrawer();
    if (cache[id]) {
      active.messages = cache[id].messages.slice();
      active.title = cache[id].title;
      renderActive();
      return;
    }
    messagesEl.innerHTML = '<div class="chat-empty"><span class="typing">LOADING CHAT <span class="cursor-blink"></span></span></div>';
    updateChatTitle();
    renderList();
    var target = active;
    api('GET', id).then(function (chat) {
      cache[id] = chat;
      if (active !== target) return;
      active.messages = chat.messages.slice();
      active.title = chat.title;
      renderActive();
    }).catch(function (err) {
      if (active !== target) return;
      if (err.status === 404) {
        summaries = summaries.filter(function (c) { return c.id !== id; });
        newChat();
      } else {
        messagesEl.innerHTML = '';
        addMessage('assistant', 'Couldn\'t load this chat: ' + err.message, { error: true });
      }
    });
  }

  function renameChat(id) {
    var sum = summaries.filter(function (c) { return c.id === id; })[0];
    if (!sum) return;
    var title = window.prompt('Rename chat', sum.title);
    if (title === null) return;
    title = title.replace(/\s+/g, ' ').trim().slice(0, 80);
    if (!title || title === sum.title) return;
    sum.title = title;
    if (cache[id]) cache[id].title = title;
    if (active.id === id) { active.title = title; updateChatTitle(); }
    renderList();
    api('PATCH', id, { title: title }).catch(function (err) { showNote('Couldn\'t rename: ' + err.message, true); });
  }

  function deleteChat(id) {
    var sum = summaries.filter(function (c) { return c.id === id; })[0];
    if (!sum || !window.confirm('Delete "' + sum.title + '"? This can\'t be undone.')) return;
    summaries = summaries.filter(function (c) { return c.id !== id; });
    delete cache[id];
    if (active.id === id) newChat(); else renderList();
    api('DELETE', id).catch(function (err) { showNote('Couldn\'t delete: ' + err.message, true); });
  }

  function openDrawer() { document.body.classList.add('drawer-open'); }
  function closeDrawer() { document.body.classList.remove('drawer-open'); }

  listEl.addEventListener('click', function (e) {
    var item = e.target.closest('.chat-item');
    if (!item) return;
    var id = item.dataset.id;
    if (e.target.closest('.del')) deleteChat(id);
    else if (e.target.closest('.ren')) renameChat(id);
    else if (e.target.closest('.chat-open')) openChat(id);
  });
  searchEl.addEventListener('input', renderList);
  document.getElementById('openDrawerBtn').addEventListener('click', openDrawer);
  document.getElementById('closeDrawerBtn').addEventListener('click', closeDrawer);
  document.getElementById('backdrop').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });

  function loadHistory() {
    var fromUrl = (location.hash.match(/^#c=([A-Za-z0-9_-]{8,64})$/) || [])[1];
    var wanted = fromUrl || lsGet(CURRENT_KEY);
    var legacy = null;
    try { legacy = JSON.parse(lsGet(LEGACY_KEY) || 'null'); } catch (e) {}

    api('GET').then(function (d) {
      summaries = (d.chats || []).slice();
      // Bring over the conversation older versions of this page kept in the browser.
      if (Array.isArray(legacy) && legacy.length) {
        var old = { id: newId(), title: titleFrom((legacy.filter(function (m) { return m.role === 'user'; })[0] || {}).content || 'Earlier chat'), messages: legacy, saved: false };
        lsSet(LEGACY_KEY, null);
        upsertSummary({ id: old.id, title: old.title, createdAt: nowIso(), updatedAt: nowIso(), count: legacy.length }, false);
        cache[old.id] = { id: old.id, title: old.title, messages: legacy.slice() };
        persist(old);
        if (!wanted) wanted = old.id;
      }
      if (wanted && summaries.some(function (c) { return c.id === wanted; })) openChat(wanted);
      else renderActive();
    }).catch(function (err) {
      historyOk = false;
      showNote(err.status === 401 ? 'Your login has expired — refresh and sign in again.' : 'Chat history is unavailable right now. You can still chat, but this conversation won\'t be saved.', true);
      if (Array.isArray(legacy) && legacy.length) active.messages = legacy;
      renderActive();
    });
  }

  // ─── events ───
  form.addEventListener('submit', function (e) { e.preventDefault(); send(); });

  sendBtn.addEventListener('click', function (e) {
    if (controller) { e.preventDefault(); controller.abort(); }
  });

  input.addEventListener('input', autosize);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });

  document.getElementById('newChatBtn').addEventListener('click', newChat);

  messagesEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.copy-btn');
    if (!btn) return;
    var code = btn.closest('.code-block').querySelector('code').textContent;
    var done = function () { btn.textContent = 'COPIED'; setTimeout(function () { btn.textContent = 'COPY'; }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(done, function () {});
  });

  // ─── start ───
  renderActive();
  loadHistory();
  checkStatus();
  input.focus();
})();
</script>
</body>
</html>
