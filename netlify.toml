# Netlify configuration for byjeki.com
# Static site: no build step, serve files from the repo root.
[build]
  publish = "."
  command = ""

# Edge functions run in the order listed here: "auth" must come first so every
# page and API (including the AI chat) is behind the login.
[[edge_functions]]
  function = "auth"
  path = "/*"

[[edge_functions]]
  function = "chat"
  path = "/api/chat"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
