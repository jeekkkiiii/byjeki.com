<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>LOGIN.EXE — Access Required</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #00ff88;
    --green-dim: #00cc6a;
    --green-muted: rgba(0,255,136,0.12);
    --green-border: rgba(0,255,136,0.25);
    --bg: #0a0d0a;
    --bg-panel: #0d120d;
    --bg-card: #0f150f;
    --text: #c8e8c8;
    --text-dim: #7aaa7a;
    --text-muted: #4a6a4a;
    --scanline: rgba(0,0,0,0.35);
    --amber: #ffb700;
    --red: #ff4466;
    --mono: 'Share Tech Mono', monospace;
    --display: 'VT323', monospace;
    --body: 'Inter', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* CRT scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, var(--scanline) 2px, var(--scanline) 4px);
    pointer-events: none;
    z-index: 9999;
    opacity: 0.18;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(0,255,136,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ─── NAVBAR ─── */
  nav {
    height: 52px;
    padding: 0 2rem;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--green-border);
    background: rgba(10,13,10,0.95);
  }

  .nav-prompt { color: var(--green); font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .nav-prompt .path { color: var(--text-dim); }
  .nav-status { margin-left: auto; font-size: 11px; letter-spacing: 0.12em; color: var(--amber); }

  .cursor-blink {
    display: inline-block;
    width: 8px; height: 14px;
    background: var(--green);
    animation: blink 1.1s step-end infinite;
    vertical-align: middle;
  }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes shake { 0%,100% { transform: none; } 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

  /* ─── LOGIN ─── */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 16px;
    position: relative;
    z-index: 1;
  }

  .terminal {
    width: 100%;
    max-width: 440px;
    background: var(--bg-card);
    border: 1px solid var(--green-border);
    box-shadow: 0 8px 40px rgba(0,255,136,0.08);
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.2s;
  }

  .terminal.error { animation: fadeUp 0.8s ease forwards 0.2s, shake 0.45s ease 1s; }

  .titlebar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid var(--green-border);
    background: var(--bg-panel);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--text-dim);
  }

  .titlebar .dots { display: flex; gap: 6px; }
  .titlebar .dots span { width: 8px; height: 8px; border: 1px solid var(--green-border); }
  .titlebar .dots span:first-child { background: var(--green); border-color: var(--green); }

  .terminal-body { padding: 2rem 1.75rem; }

  .eyebrow { font-size: 11px; letter-spacing: 0.2em; color: var(--green); margin-bottom: 1rem; }

  h1 {
    font-family: var(--display);
    font-weight: normal;
    font-size: clamp(44px, 10vw, 60px);
    line-height: 1;
    color: var(--green);
    text-shadow: 0 0 40px rgba(0,255,136,0.3);
    margin-bottom: 1rem;
  }

  h1 span { color: var(--text); }

  .boot {
    font-size: 12px;
    line-height: 1.9;
    color: var(--text-dim);
    border-left: 2px solid var(--green-border);
    padding-left: 1rem;
    margin-bottom: 1.75rem;
    min-height: 4.2em;
  }

  .boot .ok { color: var(--green); }
  .boot .warn { color: var(--amber); }

  .field { margin-bottom: 1.25rem; }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
  }

  label .prompt { color: var(--green); }

  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--green-border);
    color: var(--green);
    font-family: var(--mono);
    font-size: 15px;
    padding: 12px 14px;
    outline: none;
    caret-color: var(--green);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-muted); }
  input:-webkit-autofill { -webkit-text-fill-color: var(--green); -webkit-box-shadow: 0 0 0 1000px var(--bg) inset; }

  .error-msg {
    display: none;
    font-size: 12px;
    color: var(--red);
    border: 1px solid rgba(255,68,102,0.35);
    background: rgba(255,68,102,0.08);
    padding: 10px 12px;
    margin-bottom: 1.25rem;
    letter-spacing: 0.04em;
  }

  .error-msg.show { display: block; }

  .btn-primary {
    width: 100%;
    background: var(--green);
    color: #000;
    border: none;
    padding: 13px 28px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary:hover { background: #fff; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(0,255,136,0.4); }
  .btn-primary:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .btn-primary:disabled { opacity: 0.6; cursor: wait; transform: none; box-shadow: none; }

  .hint { margin-top: 1.25rem; font-size: 11px; color: var(--text-muted); text-align: center; letter-spacing: 0.06em; }

  footer {
    padding: 1.25rem 2rem;
    border-top: 1px solid var(--green-border);
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    font-size: 11px;
    color: var(--text-muted);
    position: relative;
    z-index: 1;
  }

  .footer-logo { font-family: var(--display); font-size: 18px; color: var(--green); }

  @media (max-width: 520px) {
    nav { padding: 0 16px; }
    .nav-status { display: none; }
    .terminal-body { padding: 1.5rem 1.25rem; }
    footer { padding: 1rem 16px; flex-direction: column; align-items: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .terminal { opacity: 1; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-prompt">
    <span>▶</span>
    <span class="path">~/portfolio</span>
    <span>$</span>
    <span style="color:var(--text-dim)">login</span>
    <span class="cursor-blink"></span>
  </div>
  <div class="nav-status">● RESTRICTED ACCESS</div>
</nav>

<main>
  <div class="terminal" id="terminal">
    <div class="titlebar">
      <span>AUTH_SESSION.LOG</span>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
    <div class="terminal-body">
      <p class="eyebrow">// SECURE TERMINAL</p>
      <h1>ACCESS<br>REQ<span>U</span>IRED</h1>

      <div class="boot" id="boot" aria-live="polite"></div>

      <div class="error-msg" id="errorMsg" role="alert">&gt; ACCESS DENIED — invalid credentials. Try again.</div>

      <form method="POST" action="/login" id="loginForm" autocomplete="on">
        <input type="hidden" name="next" id="nextField" value="/">
        <div class="field">
          <label for="username"><span class="prompt">&gt;</span> USER_ID</label>
          <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        </div>
        <div class="field">
          <label for="password"><span class="prompt">&gt;</span> PASSKEY</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">[ AUTHENTICATE ]</button>
      </form>

      <p class="hint">Authorised users only. Session expires after 7 days.</p>
    </div>
  </div>
</main>

<footer>
  <div class="footer-logo">PORTFOLIO.EXE</div>
  <div>© 2025 — built with intention</div>
</footer>

<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var next = params.get('next');
    if (next && next.charAt(0) === '/' && next.charAt(1) !== '/') {
      document.getElementById('nextField').value = next;
    }

    var failed = params.has('error');
    if (failed) {
      document.getElementById('errorMsg').classList.add('show');
      document.getElementById('terminal').classList.add('error');
    }

    var lines = [
      '<span class="ok">[ OK ]</span> narrative engine loaded',
      '<span class="ok">[ OK ]</span> secure channel established',
      failed
        ? '<span class="warn">[ !! ]</span> authentication failed — retry'
        : '<span class="warn">[ .. ]</span> awaiting credentials'
    ];
    var boot = document.getElementById('boot');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) {
      boot.innerHTML = lines.join('<br>');
    } else {
      lines.forEach(function (line, i) {
        setTimeout(function () {
          boot.innerHTML += (i ? '<br>' : '') + line;
        }, 500 + i * 350);
      });
    }

    document.getElementById('loginForm').addEventListener('submit', function () {
      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '[ VERIFYING... ]';
    });
  })();
</script>
</body>
</html>
